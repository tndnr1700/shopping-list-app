<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #8a8f98;
    --accent: #3d7eff;
    --accent-light: #eaf1ff;
    --danger: #ff5c5c;
    --border: #e6e8eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 16px;
    text-align: center;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-row input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    background: var(--card);
    color: var(--text);
  }
  .input-row input:focus {
    border-color: var(--accent);
  }
  .input-row button {
    padding: 12px 18px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  .input-row button:active {
    opacity: 0.85;
  }
  .stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 13px;
    color: var(--muted);
  }
  .stats button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    padding: 4px;
  }
  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  li .checkbox {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }
  li.checked .checkbox {
    background: var(--accent);
    border-color: var(--accent);
  }
  li .checkbox svg {
    width: 13px;
    height: 13px;
    display: none;
  }
  li.checked .checkbox svg {
    display: block;
  }
  li .name {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
    cursor: pointer;
  }
  li.checked .name {
    color: var(--muted);
    text-decoration: line-through;
  }
  li .delete {
    background: none;
    border: none;
    color: var(--danger);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 4px 6px;
    flex-shrink: 0;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #23252a;
      --text: #eef0f2;
      --muted: #9198a1;
      --accent: #5b93ff;
      --accent-light: #1d2b46;
      --border: #33363b;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <div class="input-row">
      <input type="text" id="itemInput" placeholder="살 물건을 입력하세요" maxlength="60">
      <button id="addBtn">추가</button>
    </div>
    <div class="stats">
      <span id="statsText">0개 항목</span>
      <button id="clearCheckedBtn">체크된 항목 삭제</button>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="emptyMsg" style="display:none;">아직 담긴 항목이 없어요</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = 'https://qjhczovgzqursyrqumbq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_3PcKIF0t16RZH6vym0GBjQ_TDEDHQrI';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('itemInput');
  const addBtn = document.getElementById('addBtn');
  const statsText = document.getElementById('statsText');
  const emptyMsg = document.getElementById('emptyMsg');
  const clearCheckedBtn = document.getElementById('clearCheckedBtn');

  let items = [];

  async function loadItems() {
    const { data, error } = await db
      .from('shopping_items')
      .select('*')
      .order('created_at', { ascending: true });
    if (error) {
      console.error('Failed to load items:', error);
      return;
    }
    items = data;
    render();
  }

  function render() {
    listEl.innerHTML = '';
    if (items.length === 0) {
      emptyMsg.style.display = 'block';
    } else {
      emptyMsg.style.display = 'none';
    }

    items.forEach(function (item) {
      const li = document.createElement('li');
      li.className = item.checked ? 'checked' : '';
      li.dataset.id = item.id;

      const checkbox = document.createElement('div');
      checkbox.className = 'checkbox';
      checkbox.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      checkbox.addEventListener('click', function () { toggleItem(item.id); });

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = item.name;
      name.addEventListener('click', function () { toggleItem(item.id); });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete';
      deleteBtn.textContent = '✕';
      deleteBtn.addEventListener('click', function () { deleteItem(item.id); });

      li.appendChild(checkbox);
      li.appendChild(name);
      li.appendChild(deleteBtn);
      listEl.appendChild(li);
    });

    const checkedCount = items.filter(function (i) { return i.checked; }).length;
    statsText.textContent = items.length + '개 항목 · ' + checkedCount + '개 완료';
  }

  async function addItem() {
    const value = inputEl.value.trim();
    if (!value) return;
    inputEl.value = '';
    const { error } = await db
      .from('shopping_items')
      .insert({ name: value, checked: false });
    if (error) {
      console.error('Failed to add item:', error);
      return;
    }
    await loadItems();
    inputEl.focus();
  }

  async function toggleItem(id) {
    const item = items.find(function (i) { return i.id === id; });
    if (!item) return;
    const { error } = await db
      .from('shopping_items')
      .update({ checked: !item.checked })
      .eq('id', id);
    if (error) {
      console.error('Failed to update item:', error);
      return;
    }
    await loadItems();
  }

  async function deleteItem(id) {
    const { error } = await db
      .from('shopping_items')
      .delete()
      .eq('id', id);
    if (error) {
      console.error('Failed to delete item:', error);
      return;
    }
    await loadItems();
  }

  async function clearChecked() {
    const { error } = await db
      .from('shopping_items')
      .delete()
      .eq('checked', true);
    if (error) {
      console.error('Failed to clear checked items:', error);
      return;
    }
    await loadItems();
  }

  addBtn.addEventListener('click', addItem);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') addItem();
  });
  clearCheckedBtn.addEventListener('click', clearChecked);

  loadItems();
})();
</script>
</body>
</html>
